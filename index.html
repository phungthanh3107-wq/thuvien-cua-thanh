<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sách của Thanh</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --accent: #6c5ce7; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', "Times New Roman", serif; background: var(--bg); margin: 0; }
        .container { max-width: 900px; margin: auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; border-bottom: 2px solid #eee; }
        .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px; margin-top: 40px; }
        .book { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; }
        .book img { width: 100%; height: 280px; object-fit: cover; }
        .book-info { padding: 15px; text-align: center; font-weight: 600; }
        #admin-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 100; }
        .modal-body { background: white; width: 90%; max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #toc-view, #reader-view { display: none; background: white; min-height: 100vh; padding: 40px 20px; border-radius: 20px; }
        /* Thanh điều hướng chương */
.nav-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    background: #222; /* Màu tối như hình cậu gửi */
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 20px;
    position: sticky;
    top: 10px;
    z-index: 10;
}

.nav-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
}

.nav-btn:hover { background: var(--accent); color: white; }
.nav-btn:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }

.chapter-select {
    padding: 8px 15px;
    border-radius: 5px;
    border: none;
    font-weight: 500;
}

.home-icon { font-size: 24px; color: white; cursor: pointer; text-decoration: none; }
        .content { font-size: 21px; line-height: 1.8; text-align: justify; font-family: "Times New Roman", serif; white-space: pre-wrap; }
   .read-tag {
    font-size: 12px;
    background: #4caf50;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 10px;
    display: inline-block;
}
.chapter-item.read { color: #888; }
        .cmt-item {
    background: white;
    padding: 15px;
    border-radius: 10px;
    border-left: 4px solid var(--accent);
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    margin-bottom: 15px;
}
.cmt-user { font-weight: bold; color: var(--accent); margin-bottom: 5px; display: block; }
.cmt-time { font-size: 11px; color: #999; margin-left: 10px; }
.cmt-text { font-size: 16px; line-height: 1.5; color: #444; }
    </style>
</head>
<body>

<div class="container" id="main-ui">
    <header>
        <div style="font-size:24px; font-weight:bold">Thanh's Library</div>
        <span style="cursor:pointer; color:#ccc; font-size:12px" onclick="openAdmin()">Quản trị</span>
    </header>
    <div id="shelf" class="shelf"></div>
</div>

<div id="admin-modal">
    <div class="modal-body">
        <h3>Đăng chương mới</h3>
        <input type="hidden" id="editIndex" value="-1">
        <input type="text" id="sName" placeholder="Tên bộ truyện">
        <input type="text" id="cName" placeholder="Tên chương">
        <input type="file" id="cFile" accept="image/*">
        <textarea id="textContent" rows="8" placeholder="Nội dung..."></textarea>
        <button class="btn" id="saveBtn" onclick="saveStory()">Lưu Lên Đám Mây</button>
        <button onclick="closeAdmin()" style="background:none; border:none; color:gray; width:100%; margin-top:15px; cursor:pointer">Hủy</button>
    </div>
</div>

<div class="container" id="toc-view">
    <button onclick="location.reload()">← Quay về kệ sách</button>
    <h1 id="toc-title"></h1>
    <div id="chapter-list"></div>
</div>

<div class="container" id="reader-view">
    <div class="nav-bar">
        <a class="home-icon" onclick="location.reload()">⌂</a> 
        <button class="nav-btn" id="prev-btn" onclick="changeChapter(-1)"> < </button>
        
        <select id="chapter-dropdown" class="chapter-select" onchange="jumpToChapter(this.value)">
            </select>

        <button class="nav-btn" id="next-btn" onclick="changeChapter(1)"> > </button>
    </div>

    <h2 id="read-title" style="text-align:center; margin-top:30px;"></h2>
    <div id="read-content" class="content"></div>
    
    <div class="nav-bar" style="margin-top:50px; position: static;">
        <button class="nav-btn" id="prev-btn-bottom" onclick="changeChapter(-1)"> < </button>
        <button class="nav-btn" id="next-btn-bottom" onclick="changeChapter(1)"> > </button>
    </div>
    <div style="margin-top: 50px; border-top: 1px solid #ddd; padding-top: 30px;">
        <h3>Bình luận từ độc giả</h3>
        
        <div style="background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 30px;">
            <input type="text" id="cmtName" placeholder="Tên của cậu..." style="margin-bottom: 10px;">
            <textarea id="cmtContent" rows="3" placeholder="Cảm nhận của cậu về chương này..."></textarea>
            <button class="btn" onclick="sendComment()" style="margin-top: 10px;">Gửi bình luận</button>
        </div>

        <div id="comment-list"></div>
    </div>
</div>
</div>

<script>
    // 1. Cấu hình Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBV2vAqCNwh9AV8nkaP-LFK3nhRvTgGo8A",
        authDomain: "thanh-89431.firebaseapp.com",
       databaseURL: "https://thanh-89431-default-rtdb.firebaseio.com",
        projectId: "thanh-89431",
        storageBucket: "thanh-89431.firebasestorage.app",
        messagingSenderId: "175005835895",
        appId: "1:175005835895:web:e117a3664b79ee99399c72",
        measurementId: "G-2GQMJQDB1W"
    };

   // 2. Khởi tạo hệ thống
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let library = {};
    let currentBookName = "";
    let currentChapterIndex = 0;
    let isAdminMode = false; // 
    // 3. Tự động tải truyện từ đám mây
    db.ref('books').on('value', (snapshot) => {
        library = snapshot.val() || {};
        renderShelf();
    });

    // 4. Các hàm Quản trị
    function openAdmin() {
    let pass = prompt("Mật mã quản trị:");
    if(pass === "hivong@123") {
        isAdminMode = true; // Kích hoạt chế độ Ad
        renderShelf(); // Vẽ lại kệ sách để hiện các quyền năng mới (nếu cần)
        document.getElementById('admin-modal').style.display='block';
        alert("Chào chủ nhân! Chế độ chỉnh sửa đã được kích hoạt.");
    } else {
        alert("Sai mật mã rồi bro!");
    }
}

    function closeAdmin() { document.getElementById('admin-modal').style.display='none'; }

    function prepareEdit(bookName, index) {
        const chapter = library[bookName].chapters[index];
        document.getElementById('sName').value = bookName;
        document.getElementById('cName').value = chapter.title;
        document.getElementById('textContent').value = chapter.content;
        document.getElementById('editIndex').value = index;
        
        document.getElementById('admin-modal').style.display = 'block';
        document.getElementById('saveBtn').innerText = "Cập nhật chương";
    }
function deleteBook(name) {
    if (confirm(`Cậu có chắc chắn muốn xóa vĩnh viễn bộ "${name}" không? Hành động này không thể hoàn tác đâu nha!`)) {
        db.ref('books/' + name).remove()
            .then(() => {
                alert("Đã xóa sạch sành sanh!");
                // Không cần load lại trang vì .on('value') sẽ tự cập nhật kệ sách
            })
            .catch((err) => {
                alert("Lỗi xóa rồi Huy ơi: " + err.message);
            });
    }
}
    function saveStory() {
        const name = document.getElementById('sName').value, 
              chap = document.getElementById('cName').value, 
              text = document.getElementById('textContent').value,
              file = document.getElementById('cFile').files[0],
              editIndex = parseInt(document.getElementById('editIndex').value);
        
        const btn = document.getElementById('saveBtn');
        btn.innerText = "Đang xử lý..."; btn.disabled = true;

        let currentChapters = (library[name] && library[name].chapters) ? library[name].chapters : [];

        if (editIndex > -1) {
            currentChapters[editIndex] = { title: chap, content: text };
        } else {
            currentChapters.push({ title: chap, content: text });
        }

        if(file && editIndex === -1) {
            let r = new FileReader();
            r.onload = e => {
                db.ref('books/' + name).set({ cover: e.target.result, chapters: currentChapters })
                  .then(() => { alert("Đã thành công!"); location.reload(); });
            };
            r.readAsDataURL(file);
        } else {
            db.ref('books/' + name + '/chapters').set(currentChapters).then(() => {
                alert("Đã thành công!");
                location.reload();
            });
        }
    }

    // 5. Hiển thị Giao diện
   function renderShelf() {
    const s = document.getElementById('shelf'); 
    s.innerHTML = '';
    
    for(let n in library) {
        // Nếu là Admin thì mới hiện nút Xóa màu đỏ
        const delBtn = isAdminMode ? `
            <button onclick="event.stopPropagation(); deleteBook('${n}')" 
                style="position:absolute; top:10px; right:10px; background:rgba(255, 68, 68, 0.9); color:white; border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; font-weight:bold; z-index:5;">
                ✕
            </button>` : '';

        s.innerHTML += `
            <div class="book" style="position:relative;" onclick="showTOC('${n}')">
                ${delBtn}
                <img src="${library[n].cover}">
                <div class="book-info">${n}</div>
            </div>`;
    }
}
    function sendComment() {
    const name = document.getElementById('cmtName').value || "Độc giả ẩn danh";
    const text = document.getElementById('cmtContent').value;
    
    if(!text) return alert("Thanh ơi, bảo độc giả nhập nội dung bình luận đã nhé!");

    const cmtData = {
        name: name,
        text: text,
        time: new Date().toLocaleString('vi-VN')
    };

    // Lưu vào Firebase theo cấu trúc: comments -> [Tên truyện] -> [Chương số mấy]
    db.ref(`comments/${currentBookName}/${currentChapterIndex}`).push(cmtData)
      .then(() => {
          document.getElementById('cmtContent').value = ""; // Xóa trắng ô nhập sau khi gửi
          alert("Gửi bình luận thành công rồi Thanh ơi!");
      });
}

 function showTOC(n) {
    document.getElementById('main-ui').style.display='none'; 
    document.getElementById('toc-view').style.display='block';
    document.getElementById('toc-title').innerText = n;
    
    const history = JSON.parse(localStorage.getItem('readHistory') || '{}');
    const readChapters = history[n] || [];

    document.getElementById('chapter-list').innerHTML = library[n].chapters.map((ch, i) => {
        const isRead = readChapters.includes(i);
        
        // Đoạn này kiểm tra: Nếu là Ad thì hiện nút sửa, không thì thôi
        const editBtn = isAdminMode ? `<button onclick="prepareEdit('${n}',${i})" style="background:none; border:none; cursor:pointer; font-size:16px;">✎</button>` : '';

        return `
            <div class="chapter-item" style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:15px 20px;">
                <div onclick="showReader('${n}',${i})" style="flex-grow:1; cursor:pointer">
                    ${ch.title} ${isRead ? '<span class="read-tag">✓ Đã đọc</span>' : ''}
                </div>
                ${editBtn} 
            </div>
        `;
    }).join('');
}
    function showReader(n, i) {
    currentBookName = n; currentChapterIndex = i;
    
    // Đánh dấu đã đọc
    let history = JSON.parse(localStorage.getItem('readHistory') || '{}');
    if (!history[n]) history[n] = [];
    if (!history[n].includes(i)) { history[n].push(i); localStorage.setItem('readHistory', JSON.stringify(history)); }

    document.getElementById('toc-view').style.display='none'; 
    document.getElementById('reader-view').style.display='block';
    
    const chapters = library[n].chapters;
    document.getElementById('read-title').innerText = chapters[i].title;
    document.getElementById('read-content').innerText = chapters[i].content;

    // Cập nhật dropdown
    const dropdown = document.getElementById('chapter-dropdown');
    dropdown.innerHTML = chapters.map((ch, index) => 
        `<option value="${index}" ${index == i ? 'selected' : ''}>${ch.title}</option>`
    ).join('');

    document.getElementById('prev-btn').disabled = i === 0;
    document.getElementById('prev-btn-bottom').disabled = i === 0;
    document.getElementById('next-btn').disabled = i === chapters.length - 1;
    document.getElementById('next-btn-bottom').disabled = i === chapters.length - 1;

    // --- TẢI BÌNH LUẬN ---
    const cmtList = document.getElementById('comment-list');
    cmtList.innerHTML = "Đang tải bình luận...";
    
    db.ref(`comments/${n}/${i}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if(!data) {
            cmtList.innerHTML = "<p style='color:gray; font-style:italic;'>Chưa có bình luận nào. Hãy là người đầu tiên!</p>";
            return;
        }
        
        cmtList.innerHTML = Object.values(data).reverse().map(c => `
            <div class="cmt-item">
                <span class="cmt-user">${c.name} <small class="cmt-time">${c.time}</small></span>
                <div class="cmt-text">${c.text}</div>
            </div>
        `).join('');
    });

    window.scrollTo(0,0);
}
    function changeChapter(step) {
        const newIndex = currentChapterIndex + step;
        if (newIndex >= 0 && newIndex < library[currentBookName].chapters.length) showReader(currentBookName, newIndex);
    }

    function jumpToChapter(index) {
        showReader(currentBookName, parseInt(index));
    }
</script>
</body>
</html>
